name: Django CI/CD Pipeline

on:   # [push, pull_request]
  push:
    branches:
      - Feature/Kurs

  pull_request:
    branches:
      - Develop

jobs:
  test:
    runs-on: ubuntu-latest
    # needs: lint
    # Тут можно указать раздел env: и задать переменные из секретов
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres  # Тут можно указать либо из раздела выше ${{ env.ПЕРЕМЕННАЯ }}, либо грузим из секретов
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kurs5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Загружаем всю историю
        ref: main       # Явно указываем ветку

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev file

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}-v2
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Set PostgreSQL environment variables for psycopg2
      run: |
        echo "PGHOST=127.0.0.1" >> $GITHUB_ENV
        echo "PGPORT=5432" >> $GITHUB_ENV
        echo "PGUSER=postgres" >> $GITHUB_ENV
        echo "PGPASSWORD=postgres" >> $GITHUB_ENV
        echo "PGDATABASE=kurs5" >> $GITHUB_ENV

    - name: Set environment variables
      run: |  # Вполне возможно это и не надо будет если будет задан выше раздел env
        echo "SECRET_KEY=django-insecure-ci-test-key" >> .env
        echo "DB_NAME=kurs5" >> .env
        echo "DB_USER=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=5432" >> .env
        echo "EMAIL_HOST_USER=test@example.com" >> .env
        echo "EMAIL_HOST_PASSWORD=test_password" >> .env
        echo "CELERY_BROKER_URL=redis://127.0.0.1:6379/0" >> .env
        echo "CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/0" >> .env
        echo "REDIS_HOST=127.0.0.1" >> .env
        echo "GITHUB_ACTIONS=true" >> .env

    - name: Set Python path
      run: |
        echo "PYTHONPATH=$PWD" >> $GITHUB_ENV     

    - name: Install Poetry
      run: pipx install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root

    - name: Debug .env file
      run: |
        echo "=== .env file content ==="
        cat .env
        echo "=========================="
        echo "=== Python environment ==="
        poetry run python -c "from dotenv import load_dotenv; import os; load_dotenv(); print('DB_HOST:', os.getenv('DB_HOST')); print('DB_NAME:', os.getenv('DB_NAME'))"

    - name: Run migrations
      run: |
        export PYTHONPATH=$PWD
        poetry run python manage.py migrate

    - name: Run tests
      run: |
        export PYTHONPATH=$PWD
        poetry run python manage.py test 
