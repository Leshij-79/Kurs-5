name: Django CI/CD Pipeline

on:   # [push, pull_request]
  push:
    branches:
      - Feature/Kurs

  pull_request:
    branches:
      - Develop

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kurs5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev file postgresql-client

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}-v2
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Wait for Postgres to be ready
      run: |
        echo "Waiting for Postgres to be ready..."
        for i in {1..30}; do
          if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
            echo "Postgres is ready!"
            break
          fi
          echo "Waiting for Postgres... ($i/30)"
          sleep 2
        done

    - name: Test direct PostgreSQL connection
      run: |
        echo "=== Testing direct PostgreSQL connection ==="
        PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kurs5 -c "SELECT version();"
        PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d kurs5 -c "SELECT 1 as test;"
        echo "=== Direct connection successful! ==="

    - name: Test Python psycopg2 connection
      run: |
        echo "=== Testing Python psycopg2 connection ==="
        poetry run python -c "
        import psycopg2
        try:
            conn = psycopg2.connect(
                dbname='kurs5',
                user='postgres',
                password='postgres',
                host='127.0.0.1',
                port='5432'
            )
            cursor = conn.cursor()
            cursor.execute('SELECT 1 as test')
            result = cursor.fetchone()
            print(f'Connection successful! Result: {result[0]}')
            conn.close()
            print('=== Python psycopg2 connection successful! ===')
        except Exception as e:
            print(f'Connection failed: {e}')
            exit(1)
        "

    - name: Install Poetry
      run: pipx install poetry

    - name: Configure Poetry
      run: |
        poetry config virtualenvs.in-project true

    - name: Install dependencies
      run: |
        poetry install --no-interaction --no-root

    - name: Create static directory
      run: |
        mkdir -p static

    - name: Set environment variables directly
      run: |
        echo "SECRET_KEY=django-insecure-ci-test-key" >> $GITHUB_ENV
        echo "DB_NAME=kurs5" >> $GITHUB_ENV
        echo "DB_USER=postgres" >> $GITHUB_ENV
        echo "DB_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "EMAIL_HOST_USER=test@example.com" >> $GITHUB_ENV
        echo "EMAIL_HOST_PASSWORD=test_password" >> $GITHUB_ENV
        echo "CELERY_BROKER_URL=redis://127.0.0.1:6379/0" >> $GITHUB_ENV
        echo "CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/0" >> $GITHUB_ENV
        echo "REDIS_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV

    - name: Set Python path
      run: |
        echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    - name: Debug environment variables
      run: |
        echo "=== Environment variables ==="
        env | grep -E "DB_|SECRET_KEY"
        echo "=== Test Django connection ==="
        poetry run python -c "
        import os
        print('DB_NAME:', os.getenv('DB_NAME'))
        print('DB_USER:', os.getenv('DB_USER'))
        print('DB_PASSWORD:', os.getenv('DB_PASSWORD'))
        print('DB_HOST:', os.getenv('DB_HOST'))
        print('DB_PORT:', os.getenv('DB_PORT'))
        "

    - name: Run migrations
      run: |
        export PYTHONPATH=$PWD
        poetry run python manage.py migrate

    - name: Run tests
      run: |
        export PYTHONPATH=$PWD
        poetry run python manage.py test